steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'build', '-t', 'us-east4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0', '.' ]
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'push', 'us-east4-docker.pkg.dev/$PROJECT_ID/my-repository/sample-app:v1.0' ]
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    gcloud container clusters get-credentials hello-cluster --zone=us-east4-a --project=$PROJECT_ID
    kubectl apply -f prod/deployment.yaml --namespace=prod
options:
  logging: CLOUD_LOGGING_ONLY
